<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Explore tasks — CUA-SWE</title>
<meta name="description" content="Explore the instructions, budgets and tests behind all 105 CUA-SWE software repair tasks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <nav class="nav wrap" aria-label="Main navigation">
    <a class="brand" href="index.html" aria-label="CUA-SWE home"><span class="cua">CUA</span><span class="bar" aria-hidden="true"></span><span class="swe">SWE</span></a>
    <ul>
      <li><a href="results.html">Results</a></li>
      <li><a href="tasks.html" aria-current="page">Tasks</a></li>
      <li><a href="index.html#paper">Resources</a></li>
      <li class="nav-external"><a data-link="viewer" href="#">Data viewer <span aria-hidden="true">↗</span></a></li>
    </ul>
  </nav>
</header>
<main class="wrap" id="main">
  <div class="explorer-head">
    <h1>Find a task.</h1>
    <p>Explore the instructions, budgets and tests behind all 105 software repairs.</p>
  </div>
  <div class="filters">
    <div class="seg" id="domain-seg" role="group" aria-label="Task domain">
      <button type="button" data-domain="all" aria-pressed="true">All</button>
      <button type="button" data-domain="web" aria-pressed="false">Web</button>
      <button type="button" data-domain="game" aria-pressed="false">Game</button>
      <button type="button" data-domain="devops" aria-pressed="false">DevOps</button>
      <button type="button" data-domain="mobile" aria-pressed="false">Mobile</button>
    </div>
    <select id="family" aria-label="Application or family"><option value="">All applications</option></select>
    <input id="q" type="search" placeholder="Search tasks" aria-label="Search task names, instructions and IDs">
  </div>
  <p class="count-line" id="count" role="status" aria-live="polite"></p>
  <ol class="tasklist" id="list"></ol>
  <div class="empty-state" id="empty" hidden>
    <p>No tasks match these filters.</p>
    <button type="button" id="clear-filters">Clear filters</button>
  </div>
</main>
<footer class="wrap">
  <a class="brand" href="index.html">CUA-SWE</a>
  <p>105 tasks. Four domains. Original agent instructions.</p>
  <a data-link="viewer" href="#">Data viewer ↗</a>
</footer>
<script src="data/tasks.js"></script>
<script src="assets/js/tasks.js"></script>
</body>
</html>
